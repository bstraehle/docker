# Angular SPA + REST API. Run with: docker compose up -d
name: spa-rest-api

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  rest-api:
    <<: *hardening
    image: ${REST_API_IMAGE:-bstraehle/rest-api:latest}
    # Non-root APP_UID of the .NET base image; the image itself doesn't set USER.
    user: "1654:1654"
    tmpfs:
      - /tmp
    # The SPA calls the API from the browser at http://host.docker.internal:8001.
    ports:
      - "8001:8080"

  spa:
    <<: *hardening
    image: ${SPA_IMAGE:-bstraehle/spa:latest}
    # nginx starts as root to bind port 80, then drops to its worker user.
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    ports:
      - "8080:80"
    depends_on:
      - rest-api
